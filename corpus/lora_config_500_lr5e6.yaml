# -- 0.7% of one epoch over 29,681 examples. Too early for real
# overfitting; reads as an LR too high for stable convergence at this
# batch size. Everything else held identical: same seed (0), same
# mlx_train_data (parent-piece-level split, zero leak), same
# max_seq_length/val_batches/rank/scale. Only learning_rate changes,
# 1.0e-5 -> 5.0e-6. Adapter path is separate so both runs' checkpoints
# survive for direct curve comparison.
