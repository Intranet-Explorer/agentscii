model: /Users/octo/.cache/huggingface/hub/models--mlx-community--Mistral-Nemo-Instruct-2407-4bit/snapshots/647ca0751669b21a364c86ccc5df54c4d7e4e91c
train: true
data: /Users/octo/agentscii/corpus/mlx_train_data
seed: 0

fine_tune_type: lora
mask_prompt: true

# rank 16, alpha 32 -- mlx_lm's config uses (rank, scale) not (rank,
# alpha) directly; scale is the standard LoRA alpha/rank ratio, so
# alpha=32 at rank=16 -> scale=2.0.
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.0

num_layers: 16
batch_size: 1
# reduced from 2 -- found live: batch_size=2 combined with even a
# small val_batches value (8) crashes with a real Metal OOM
# immediately after validation completes, on the very next training
# step. batch_size=1 was the config that completed multiple full
# train+val cycles cleanly in isolated testing (peak mem 35.4GB) --
# this doubles wall-clock iteration count for the same effective
# throughput, but a run that finishes slower beats one that crashes.
iters: 3000
learning_rate: 1.0e-5
max_seq_length: 3072
# set to 3072 (user direction, 2026-09-20), just above the REAL
# tokenizer's measured p90 on the full built prompt+target. 2048 was
# tried first per the windowing.py tiktoken-based estimate (context
# mean=1,225/p90=1,911) but the REAL Mistral tokenizer on the full
# built prompt (wrapper + chat template + context + target) measured
# heavier: mean=2,105/p50=2,109/p90=3,098/p99=3,856/max=4,490 with the
# original prose wrapper (kept only 11,790/40,000 at a 2048 cap -- a
# 3.1x cut, not a tail-trim). The prompt wrapper (build_prompt() in
# prepare_training_data.py) was then cut from ~700 chars of English
# prose re-explaining the RLE format to a minimal tagged header
# ([Y=.. G=.. TIER=.. HALF=.. SHADE=.. MASKH=.. MASKW=..] + <CTX>/
# </CTX>/<FILL> delimiters, no information lost -- the context field
# already carries the mask row/col range and per-row [MASK w=N]
# markers). Re-measured after the trim: mean=1,936/p50=1,940/
# p90=2,929/p99=3,687/max=4,321 -- p90 still lands above 2,500, so the
# cap stays at 3072 (2,560 was the fallback only if p90 dropped under
# 2,500) -- see corpus/filter_report_3072.json for exact kept counts.

val_batches: 8
# reduced from 25 -- found live: val_batches=25 (batch_size=2,
# max_seq_length=4096) completes (393s, ~15.7s/batch) but pushes
# memory to a point where the VERY NEXT training step crashes with a
# real Metal OOM ("Insufficient Memory"). val_batches=4 tested clean
# with real headroom in isolation; 8 is a conservative middle ground.
steps_per_report: 20
steps_per_eval: 500
save_every: 100
# reduced from 500 -- user direction, 2026-09-19: at 500, a crash costs
# ~1.4hr of retraining; 100 is the new default for this and future runs.

adapter_path: /Users/octo/agentscii/corpus/lora_adapters

# grad_checkpoint DISABLED -- found live: grad_checkpoint=true combined
# with validation-loss computation hangs indefinitely (0% CPU, macOS
# reports the process STATE as "stuck") under mlx_lm 0.29.1, isolated
# via direct testing (grad_checkpoint=false + val_batches=4 completes
# cleanly in ~25s; grad_checkpoint=true never completes even a single
# validation batch after 3+ minutes). Peak memory without
# grad_checkpoint measured at 35.4GB on a real training step -- well
# within this machine's 64GB budget, so grad_checkpoint's memory
# savings aren't needed here anyway.
grad_checkpoint: false
